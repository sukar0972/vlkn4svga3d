name: Tests

on:
  push:
  pull_request:

jobs:
  mock-and-translator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and SPIR-V validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev spirv-tools mesa-vulkan-drivers vulkan-validationlayers
      - name: Verify SPIR-V validator is installed
        run: command -v spirv-val
      - name: Check Piglit result reporting
        run: python3 -B -m unittest discover -s tests -p test_piglit_runner.py
      - name: Check guest graphics gate regression detection
        run: python3 -B -m unittest discover -s tests -p test_pr_graphics_gate.py
      - name: Check disposable guest cleanup
        run: python3 -B -m unittest discover -s tests -p test_oracle_guest_hook.py
      - name: Run mock backend and oracle tests
        run: make -j2 test
      - name: Run no-ICD shader translator tests
        run: make test-translator-novulkan
      - name: Run complete host harness with synchronization validation
        run: |
          export HARNESS_ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$HARNESS_ICD"
          export VK_ICD_FILENAMES="$HARNESS_ICD"
          export VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          export SPIRV_TOOLS_DIR=/usr/bin
          make -j2 all
          bash scripts/harness_loop.sh --iterations 1 --skip-build --fail-fast
          for suite in test_atomic_commands test_resource_limits test_query_state test_fifo_framing; do
            "./bin/$suite"
          done
      - name: Verify installed C consumer
        run: make test-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-vulkan-evidence
          path: |
            .harness-loop/
            artifacts/

  native-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build native QEMU test environment
        run: docker build -t vlkn-native-qemu -f integrations/qemu/Dockerfile integrations/qemu
      - name: Build source integration and boot the protocol guest
        run: |
          docker run --rm -v "$PWD:/work" -w /work vlkn-native-qemu \
            sh integrations/qemu/build.sh /work/artifacts/qemu-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qemu-results
          path: artifacts/qemu-native/results/
