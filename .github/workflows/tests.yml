name: Tests

on:
  push:
  pull_request:

jobs:
  mock-and-translator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and SPIR-V validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev spirv-tools mesa-vulkan-drivers vulkan-validationlayers
      - name: Verify SPIR-V validator is installed
        run: command -v spirv-val
      - name: Check Piglit result reporting
        run: python3 -B -m unittest discover -s tests -p test_piglit_runner.py
      - name: Run mock backend and oracle tests
        run: make -j2 test
      - name: Run no-ICD shader translator tests
        run: make test-translator-novulkan
      - name: Run malformed-input regressions
        run: make bin/test_malformed_inputs && ./bin/test_malformed_inputs
      - name: Run lavapipe guest-memory, presentation and QEMU suites
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          make -j2 test-guest-mem test-presentation test-qemu
